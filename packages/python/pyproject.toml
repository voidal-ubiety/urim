[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "urim"
version = "0.0.1"
description = "Urim: a contract language for decision models. v0.0.1 ships `urim check` for contracts and hoshen lockfiles."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.10"
authors = [{ name = "David Thomason" }]
keywords = ["decision-models", "contracts", "lockfile", "llm", "urim"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Environment :: Console",
  "Intended Audience :: Developers",
]
dependencies = ["PyYAML>=6.0"]

[dependency-groups]
test = ["pytest>=8", "pytest-cov>=6"]
lint = ["ruff>=0.8", "mypy>=1.13", "types-PyYAML>=6.0"]
dev = [{ include-group = "test" }, { include-group = "lint" }, "build>=1.2", "twine>=6"]

[project.urls]
Homepage = "https://urim.sh"
Documentation = "https://urim.sh"
Repository = "https://github.com/voidal-ubiety/urim"
Issues = "https://github.com/voidal-ubiety/urim/issues"

[project.scripts]
urim = "urim.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/urim"]

[tool.hatch.build.targets.sdist]
include = ["src/urim", "README.md", "LICENSE", "NOTICE", "pyproject.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers"]

[tool.coverage.run]
branch = true
source = ["urim"]

[tool.coverage.report]
fail_under = 100
show_missing = true
skip_covered = false

[tool.ruff]
line-length = 110
target-version = "py310"
src = ["src", "tests"]
# Generated by scripts/gen-schema (drift-checked by `scripts/gen-schema --check`), not hand-formatted.
extend-exclude = ["src/urim/schema_gen.py"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "C4", "RUF", "PT", "PL", "N", "ANN", "S", "PTH", "RET", "TRY", "PERF", "FBT", "A", "ISC", "PIE", "T20", "ERA", "D"]
ignore = [
  "COM812",        # trailing commas are the formatter's job
  "D203", "D213",  # pick one docstring style (D211/D212)
  "ISC001",        # conflicts with the formatter
  "PLR2004",       # magic values are fine for exit codes 0/1/2
  "TRY003",        # short messages in exceptions are intended
]

[tool.ruff.lint.per-file-ignores]
"src/urim/cli.py" = ["T201"]  # the CLI prints by design
"tests/**" = ["S101", "S603", "D", "ANN", "PLR0913"]

[tool.mypy]
strict = true
python_version = "3.10"
files = ["src", "tests"]
warn_unreachable = true

[tool.ruff.lint.pylint]
max-returns = 8
