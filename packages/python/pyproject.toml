[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "urim"
version = "0.0.1"
description = "Urim: a contract language for decision models. v0.0.1 ships `urim check` for contracts and hoshen lockfiles."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.10"
authors = [{ name = "David Thomason" }]
keywords = ["decision-models", "contracts", "lockfile", "llm", "urim"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Environment :: Console",
  "Intended Audience :: Developers",
]
dependencies = ["PyYAML>=6.0"]

[dependency-groups]
test = ["pytest>=8", "pytest-cov>=6"]
lint = ["ruff>=0.8", "mypy>=1.13", "types-PyYAML>=6.0"]
dev = [{ include-group = "test" }, { include-group = "lint" }, "build>=1.2", "twine>=6"]

[project.urls]
Homepage = "https://urim.sh"
Repository = "https://github.com/no-complect/urim"
Issues = "https://github.com/no-complect/urim/issues"

[project.scripts]
urim = "urim.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/urim"]

[tool.hatch.build.targets.sdist]
include = ["src/urim", "README.md", "LICENSE", "NOTICE", "pyproject.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers"]

[tool.coverage.run]
branch = true
source = ["urim"]

[tool.coverage.report]
fail_under = 100
show_missing = true
skip_covered = false
