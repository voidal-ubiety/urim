[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "urim"
version = "0.0.1"
description = "Client library for decision models: define a decision once in code, call it through provider tiers, get typed answers."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "David Thomason" }]
requires-python = ">=3.11"
dependencies = []
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.13",
  "Typing :: Typed",
]

[project.urls]
Homepage = "https://urim.sh"
Repository = "https://github.com/voidal-ubiety/urim"

[project.scripts]
urim = "urim.cli:main"

[project.optional-dependencies]
pydantic = ["pydantic>=2,<3"]
httpx = ["httpx>=0.27"]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
# mypy --strict over the library. Chosen over pyright strict: both are "strict", but pyright's
# reportUnknown* rules flag every isinstance(x, dict) narrowing of untyped JSON (190 findings, almost all
# that), while mypy --strict surfaced the real defects (ABSENT not narrowing, ErrorType as str, codec Any).
strict = true
python_version = "3.11"
files = ["src"]
mypy_path = "src"

[tool.setuptools.package-data]
urim = ["py.typed"]
