[package]
name = "urim"
version = "0.0.1"
edition = "2024"
rust-version = "1.85"
description = "Urim: a contract language for decision models. v0.0.1 ships `urim check` for contracts and hoshen lockfiles."
license = "Apache-2.0"
authors = ["David Thomason"]
homepage = "https://urim.sh"
repository = "https://github.com/no-complect/urim"
documentation = "https://docs.rs/urim"
readme = "README.md"
keywords = ["decision-models", "contracts", "lockfile", "llm", "yaml"]
categories = ["command-line-utilities", "development-tools"]
include = ["src/**", "Cargo.toml", "README.md", "LICENSE", "NOTICE"]

[lib]
name = "urim"
path = "src/lib.rs"

[[bin]]
name = "urim"
path = "src/main.rs"

[dependencies]
# serde_yaml is deprecated (archived by its author in 2024). serde_norway is the
# maintained drop-in fork (same API, YAML 1.2 core scalars, rejects duplicate keys).
serde_norway = "0.9"
# Event-level parser used to enforce the Urim YAML profile before values are built.
# Pure Rust, no `unsafe` (see research/yaml-crate-eval.md). Exact pin: see CONTRIBUTING.md.
saphyr-parser = "=0.2.2"

[dev-dependencies]
serde_json = "1"

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
missing_debug_implementations = "warn"
unreachable_pub = "warn"
unused_qualifications = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }
# restriction lints (opt-in, not part of any group)
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
indexing_slicing = "warn"
print_stdout = "warn"
print_stderr = "warn"
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"
allow_attributes = "warn"
allow_attributes_without_reason = "warn"
string_slice = "warn"
arithmetic_side_effects = "warn"
as_conversions = "warn"
# redundant_pub_crate (nursery) contradicts rustc's unreachable_pub, which we keep:
# items in private modules are `pub(crate)`, never bare `pub`.
redundant_pub_crate = "allow"
