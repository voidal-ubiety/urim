# Actions are pinned by commit SHA (tag in the comment; refresh with Dependabot). The workflow token can only read repo contents (needed to check out the private repo).
name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    # packages/check.sh is the one gate: pytest under Python 3.11 and 3.13, ruff, mypy --strict,
    # the node test suite and tsc. No network calls to providers; adapters are tested with mocks.
    name: check (node 24, python 3.11 + 3.13)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24" # engines: node >=23.6 (type stripping)
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.13.5"
      - name: python venvs (3.11, 3.13)
        run: |
          for v in 3.11 3.13; do
            uv venv --python "$v" "$RUNNER_TEMP/py$v"
            uv pip install --python "$RUNNER_TEMP/py$v/bin/python" -e "packages/urim-py[dev,pydantic,httpx]" ruff mypy
          done
      - name: npm ci (no install scripts)
        working-directory: packages/urim-ts
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: packages/check.sh
        run: PYTHONS="$RUNNER_TEMP/py3.11/bin/python $RUNNER_TEMP/py3.13/bin/python" TOOLS="$RUNNER_TEMP/py3.13/bin" bash packages/check.sh
