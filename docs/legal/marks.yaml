# Schema per entry (AUDIT-LEGAL-GATE-SPEC.md § T): mark, owner, kind
# (provider|tool|standard|platform), allowed_context, forbid_in_package_names.
# owner: taken from the gate spec's seed list. "UNVERIFIED" means nobody has confirmed
# the owner yet; confirm each one before this file is published (LEGAL-CHECKLIST A8).
# scripts/audit-legal T1 fails if a mark from this list's dictionary appears in the
# scanned files without an entry here; T4 fails if a shipped package name contains one.

